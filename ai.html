<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiBot - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🌐 WikiBot Assistant</div>
    <div id="chat-box">
        <div class="message bot">
            Hello! Type any topic (e.g., "SpaceX" or "History of Art") and I'll fetch the summary from Wikipedia for you.
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask me anything..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
